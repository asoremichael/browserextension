
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Frontend Mentor | Browser Extensions Manager</title>

  <link rel="icon" type="image/png" sizes="32x32"
    href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="style.css">

  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <header class="top-bar">
      <a href="#" class="logo" aria-label="Extensions Manager home">
        <span class="logo-icon">✿</span>
        <span>Extensions</span>
      </a>

      <button
        class="theme-toggle"
        id="theme-toggle"
        type="button"
        aria-label="Switch to light theme"
      >
        ☀
      </button>
    </header>

    <section class="extensions-section">

      <div class="section-heading">
        <h1>Extensions List</h1>

        <div class="filter-buttons" aria-label="Filter extensions">
          <button class="filter-btn active" data-filter="all"
            aria-pressed="true" type="button">All</button>

          <button class="filter-btn" data-filter="active"
            aria-pressed="false" type="button">Active</button>

          <button class="filter-btn" data-filter="inactive"
            aria-pressed="false" type="button">Inactive</button>
        </div>
      </div>

      <div class="extensions-grid" id="extensions-grid">
        <!-- JavaScript will insert the extension cards here. -->
      </div>

    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge"
        target="_blank" rel="noreferrer">Frontend Mentor</a>.
      Coded by <a href="#">Your Name</a>.
    </footer>

  </main>
</body>
</html>
